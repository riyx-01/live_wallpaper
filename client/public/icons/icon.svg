<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#FFE3E8" />
    </linearGradient>
    
    <!-- Heart Bubble Gradient -->
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB7C5" />
      <stop offset="50%" stop-color="#E88FA0" />
      <stop offset="100%" stop-color="#C55B6E" />
    </linearGradient>

    <!-- Gloss Highlight Gradient -->
    <linearGradient id="gloss-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#6B3A4D" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Base (Rounded App Icon Style) -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Cloud Elements in Background -->
  <path d="M120 380 a45 45 0 0 1 80 -10 a60 60 0 0 1 110 -15 a50 50 0 0 1 90 15 a30 30 0 0 1 10 60 L110 430 a30 30 0 0 1 10 -50 Z" fill="#FFFFFF" opacity="0.6" />
  <path d="M60 200 a30 30 0 0 1 50 -8 a40 40 0 0 1 70 -10 a35 35 0 0 1 60 10 a20 20 0 0 1 10 30 L55 222 a20 20 0 0 1 5 -22 Z" fill="#FFFFFF" opacity="0.4" />

  <!-- Main Floating Bubble Heart -->
  <g filter="url(#shadow)">
    <!-- Outer Glow Ring -->
    <path d="M256 395 l-23-22 C129 295 72 243 72 177 C72 123 113 82 167 82 c31 0 61 14 89 37 c28-23 58-37 89-37 c54 0 95 41 95 95 c0 66-57 118-161 196 l-23 22 z" 
          fill="none" stroke="#FFD2DB" stroke-width="6" opacity="0.5" />
    
    <!-- Heart Body -->
    <path d="M256 390 l-22-21 C133 291 76 240 76 175 C76 122 117 80 170 80 c31 0 60 14 86 36 c26-22 55-36 86-36 c53 0 94 42 94 95 c0 65-57 116-158 194 l-22 21 z" 
          fill="url(#heart-grad)" />
  </g>

  <!-- Bubble Highlights & Details (Gloss Effect) -->
  <!-- Top Left Soft Reflection -->
  <path d="M140 130 c-20 10 -35 30 -35 55 c0 10 8 15 15 10 c10 -10 20 -20 35 -25 c10 -3 5 -15 -15 -4 Z" 
        fill="url(#gloss-grad)" />
        
  <!-- Small Round Bubbles Floating Around -->
  <circle cx="120" cy="300" r="16" fill="#FFFFFF" opacity="0.25" />
  <circle cx="130" cy="308" r="6" fill="#FFFFFF" opacity="0.4" />
  
  <circle cx="390" cy="120" r="22" fill="#FFFFFF" opacity="0.2" />
  <circle cx="400" cy="130" r="8" fill="#FFFFFF" opacity="0.35" />

  <circle cx="370" cy="340" r="12" fill="#FFFFFF" opacity="0.15" />
</svg>
